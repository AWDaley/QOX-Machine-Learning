[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qox-machine-learning"
version = "0.1.0"
description = "Deterministic multi-agent artificial-life simulator (M0–M1)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "QOX contributors" }]
dependencies = []

[project.optional-dependencies]
viewer = ["pygame>=2.5,<3"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
qox = "qox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
