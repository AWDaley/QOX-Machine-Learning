name: Windows desktop executable

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/qox/desktop.py'
      - 'src/qox/desktop_models.py'
      - 'src/qox/learning/**'
      - 'src/qox/viewer.py'
      - 'src/qox/viewer_events.py'
      - 'src/qox/sprites.py'
      - 'src/qox/viewer_layout.py'
      - 'tests/test_m12_*.py'
      - 'qox_desktop.py'
      - 'pyproject.toml'
      - '.github/workflows/desktop-windows.yml'
      - 'tests/test_desktop.py'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install simulator and packager
        run: python -m pip install -e '.[viewer,ml]' pyinstaller
      - name: Exercise event overlays on an offscreen Pygame surface
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_m12_pygame.py tests/test_m12_events.py
      - name: Build portable desktop folder
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name QOX --collect-submodules qox --collect-all pygame qox_desktop.py
      - name: Verify the packaged executable can load, save and run five networks
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/QOX/QOX.exe").Path
          $proc = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru
          if (-not $proc.WaitForExit(120000)) {
            $proc.Kill()
            throw "QOX packaged smoke test timed out"
          }
          if ($proc.ExitCode -ne 0) { throw "QOX packaged smoke test failed: $($proc.ExitCode)" }
      - name: Create end-user ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\QOX -DestinationPath dist\QOX-Windows.zip -Force
      - name: Publish downloadable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: QOX-Windows-Desktop
          path: dist/QOX-Windows.zip
          retention-days: 30
          if-no-files-found: error
