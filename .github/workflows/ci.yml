name: Python CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: qox run --ticks 20 --mode scripted --seed 42
      - run: qox inspect --species cow --seed 42
      - run: qox inspect --species nomad --seed 42
      - run: qox inspect --species cow --cow-calls --seed 42
      - run: qox inspect --species ravager --seed 42
      - run: qox inspect --species scavenger --seed 42
      - run: qox inspect --species farmer --festivals --seed 42
      - run: qox festival-demo --scenario festival_farmer --ticks 12
      - run: qox festival-demo --scenario festival_nomad --ticks 12
      - run: qox festival-demo --scenario festival_combined --ticks 12
      - run: qox run --ticks 12 --mode scripted --festivals --trace runs/ci-festival-trace.json
      - run: qox replay --trace runs/ci-festival-trace.json
      - run: python -m pytest -q tests/test_m9.py
      - run: qox run --ticks 35 --mode scripted --reproduction --trace runs/ci-population-trace.json
      - run: qox replay --trace runs/ci-population-trace.json
      - run: qox population-study --ticks 40 --seeds 2 --sample-every 10 --seed 200000 --mode scripted --report runs/ci-m9-births.json
      - run: qox population-study --ticks 40 --seeds 2 --sample-every 10 --seed 200000 --mode scripted --without-births --report runs/ci-m9-no-births.json
  learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,ml]'
      - run: python -m pytest -q tests/test_learning.py
      - run: qox train-cow --steps 256 --worlds 2 --rollout 64 --output runs/ci-cow.pt
      - run: qox benchmark-cow --checkpoint runs/ci-cow.pt --episodes 2 --seed 90000
      - run: qox train-farmer --steps 256 --worlds 2 --rollout 64 --scenario farmer_mixed --output runs/ci-farmer.pt
      - run: qox benchmark-farmer --checkpoint runs/ci-farmer.pt --scenario refuge --episodes 2 --seed 90000
      - run: qox train-nomad --steps 128 --worlds 2 --rollout 64 --max-steps 24 --scenario nomad_herd --output runs/ci-nomad.pt
      - run: qox benchmark-nomad --checkpoint runs/ci-nomad.pt --scenario nomad_herd --episodes 2 --max-steps 24 --seed 90000
      - run: qox train-nomad --scenario nomad_signal --steps 128 --worlds 2 --rollout 64 --max-steps 8 --seed 43 --output runs/ci-nomad-signal.pt
      - run: qox benchmark-nomad --checkpoint runs/ci-nomad-signal.pt --scenario nomad_signal --episodes 2 --max-steps 8 --seed 90100
      - run: qox train-nomad --scenario nomad_herd --nomad-v2 --init-checkpoint runs/ci-nomad-signal.pt --steps 128 --worlds 2 --rollout 64 --max-steps 24 --output runs/ci-nomad-transfer.pt
      - run: qox train-cow --steps 128 --worlds 2 --rollout 64 --max-steps 24 --scenario nomad_herd --cow-calls --output runs/ci-cow-v2.pt
      - run: qox benchmark-cow --checkpoint runs/ci-cow-v2.pt --scenario nomad_herd --episodes 2 --max-steps 24 --seed 90000
      - run: qox train-cow --steps 128 --worlds 2 --rollout 64 --max-steps 24 --scenario cow_signal --cow-calls --output runs/ci-signal.pt
      - run: qox benchmark-cow --checkpoint runs/ci-signal.pt --scenario cow_signal --episodes 2 --max-steps 24 --seed 90100
      - run: qox run --ticks 10 --mode learned-herd --checkpoint runs/ci-nomad.pt --cow-checkpoint runs/ci-cow-v2.pt --trace runs/ci-herd-trace.json
      - run: qox replay --trace runs/ci-herd-trace.json
      - run: qox train-herd --phase cow --cow-checkpoint runs/ci-cow-v2.pt --nomad-checkpoint runs/ci-nomad-transfer.pt --cow-steps 96 --nomad-steps 96 --worlds 2 --rollout 96 --max-steps 24 --epochs 1 --output-dir runs/ci-joint
      - run: qox benchmark-herd --cow-checkpoint runs/ci-joint/cow_round1.pt --nomad-checkpoint runs/ci-nomad-transfer.pt --episodes 2 --max-steps 24 --seed 95000 --report runs/ci-joint-eval.json
      - run: python -m pytest -q tests/test_m6.py tests/test_ravager_learning.py
      - run: qox train-ravager --steps 128 --worlds 2 --rollout 64 --max-steps 16 --scenario ravager_mixed --output runs/ci-ravager.pt
      - run: qox benchmark-ravager --checkpoint runs/ci-ravager.pt --episodes 2 --max-steps 16 --scenario ravager_ambush --seed 92000
      - run: qox run --ticks 8 --mode learned-ravager --checkpoint runs/ci-ravager.pt --trace runs/ci-ravager-trace.json
      - run: qox replay --trace runs/ci-ravager-trace.json
      - run: python -m pytest -q tests/test_m7.py
      - run: qox train-scavenger --steps 128 --worlds 2 --rollout 64 --max-steps 16 --scenario scavenger_mixed --output runs/ci-scavenger.pt
      - run: qox benchmark-scavenger --checkpoint runs/ci-scavenger.pt --episodes 2 --max-steps 16 --scenario scavenger_competition --seed 97000
      - run: qox run --ticks 8 --mode learned-scavenger --checkpoint runs/ci-scavenger.pt --trace runs/ci-scavenger-trace.json
      - run: qox replay --trace runs/ci-scavenger-trace.json
      - run: python -m pytest -q tests/test_m8.py
      - run: qox train-festival --scenario festival_farmer --steps 128 --worlds 2 --rollout 64 --max-steps 12 --output runs/ci-festival.pt
      - run: qox benchmark-festival --scenario festival_farmer --checkpoint runs/ci-festival.pt --episodes 2 --max-steps 12 --seed 99000
      - run: qox run --ticks 10 --festivals --mode learned-festival --checkpoint runs/ci-festival.pt --trace runs/ci-learned-festival.json
      - run: qox replay --trace runs/ci-learned-festival.json
      - run: qox population-study --ticks 10 --seeds 1 --sample-every 5 --mode learned --festivals --festival-checkpoint runs/ci-festival.pt --report runs/ci-m9-frozen.json
